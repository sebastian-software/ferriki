name: Rust consumer - latest Ferroni

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  latest-ferroni:
    name: Test with latest compatible Ferroni
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Update only this ephemeral checkout to exercise the newest compatible
      # Ferroni without changing the repository's committed lockfile.
      - name: Update Ferroni
        run: cargo update -p ferroni

      - name: Test workspace with all features
        run: cargo test --workspace --all-features --locked
