name: README themes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Reruns and non-PR runs get their own group, including while pending.
concurrency:
  group: validation-${{ github.repository }}-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: true

jobs:
  readme-themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned Markdown generator
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.9.5
          install_args: --locked
      - run: mise run readme:check
