name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force-publish:
        description: Publish current main even without a new release
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: sebastian-software/ferramenta/.github/workflows/release-node-native.yml@main
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    with:
      workspace-dir: node
      package-dir: node/ferriki
      addon-name: ferriki
      config-file: .release-please-config.json
      manifest-file: .release-please-manifest.json
      force-publish: ${{ github.event_name == 'workflow_dispatch' && inputs.force-publish }}
      smoke-script: >-
        import('./ferriki/index.mjs').then((m) => {
        const version = m.ferrikiVersion();
        if (!version) throw new Error('native binding did not load')
        })
    secrets: inherit
