name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force-publish:
        description: Publish the current manifest version even without a new release
        type: boolean
        default: false
      dist-tag:
        description: npm dist-tag for an intentional release-candidate or stable publish
        type: choice
        options:
          - latest
          - next
        default: latest

permissions:
  contents: read

concurrency:
  group: publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.dist-tag || 'latest' }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish-crates:
    name: Publish to crates.io
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force-publish) }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # crates.io Trusted Publishing exchanges this OIDC token for a
      # short-lived registry token; no long-lived registry secret is stored.
      # Each crate must list this repository and `publish.yml` as a trusted
      # publisher on crates.io (see docs/release-checklist.md).
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      # Dependency order: `ferriki` depends on the two library crates. The
      # action waits for the index between crates and skips versions that are
      # already published, so a retry after a partial publish is safe.
      - name: Publish Rust crates
        uses: sebastian-software/standards/.github/actions/publish-crates@a840766444dbb0e421f1f1868c48bee315ead769 # v0.13.0
        with:
          crates: |
            ferriki-textmate
            ferriki-asset-gen
            ferriki

  build-native:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force-publish) }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            platform-id: linux-x64-gnu
          - os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            platform-id: linux-arm64-gnu
          # musl targets cross-compile with cargo-zigbuild on a glibc runner of
          # the same architecture; CI's native-smoke job loads them on Alpine.
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-musl
            platform-id: linux-x64-musl
            musl: true
          - os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-musl
            platform-id: linux-arm64-musl
            musl: true
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            platform-id: darwin-arm64
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            platform-id: win32-x64-msvc
          - os: windows-11-arm
            rust-target: aarch64-pc-windows-msvc
            platform-id: win32-arm64-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: node
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json

      - name: Set Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml

      - name: Set Rust target
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Set up Zig for the musl cross-build
        if: ${{ matrix.musl }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        if: ${{ matrix.musl }}
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native addon
        run: pnpm run build:native
        env:
          FERRIKI_RUST_TARGET: ${{ matrix.rust-target }}
          FERRIKI_PLATFORM_ID: ${{ matrix.platform-id }}

      - name: Verify platform package
        run: pnpm run check:platform-package
        env:
          FERRIKI_PLATFORM_ID: ${{ matrix.platform-id }}

      - name: Upload native sidecar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-${{ matrix.platform-id }}
          path: node/platforms/${{ matrix.platform-id }}/ferriki.node
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    needs:
      - release-please
      - build-native
    if: ${{ needs.release-please.outputs.releases_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force-publish) }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Must list every target in node/ferriki/platforms.mjs, in that order;
      # check:platform-matrix enforces it.
      FERRIKI_PLATFORM_IDS: linux-x64-gnu linux-arm64-gnu linux-x64-musl linux-arm64-musl darwin-arm64 win32-x64-msvc win32-arm64-msvc
    defaults:
      run:
        working-directory: node
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json

      - name: Set Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Node 24 supplies npm 11 for direct tarball publication with OIDC
          # Trusted Publishing and provenance after pnpm 10 packs the package.
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml

      - name: Set Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Linux native sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-linux-x64-gnu
          path: node/platforms/linux-x64-gnu

      - name: Download Linux arm64 native sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-linux-arm64-gnu
          path: node/platforms/linux-arm64-gnu

      - name: Download Linux x64 musl native sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-linux-x64-musl
          path: node/platforms/linux-x64-musl

      - name: Download Linux arm64 musl native sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-linux-arm64-musl
          path: node/platforms/linux-arm64-musl

      - name: Download macOS arm64 native sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-darwin-arm64
          path: node/platforms/darwin-arm64

      - name: Download Windows x64 native sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-win32-x64-msvc
          path: node/platforms/win32-x64-msvc

      - name: Download Windows arm64 native sidecar
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: native-win32-arm64-msvc
          path: node/platforms/win32-arm64-msvc

      # The main package ships no native addon; every platform package holds
      # the matrix-built artifact downloaded above. It ships no grammar or theme
      # payloads either: the packaged release manifest is pinned to this commit,
      # whose tree assets.ferriki.dev serves (ADR 0013).
      - name: Build package wrappers and sync standard assets
        run: |
          pnpm run build
          node ./ferriki/scripts/sync-standard-assets.mjs --release-commit "$(git rev-parse HEAD)"

      - name: Verify all release packages
        run: |
          pnpm run check:platform-matrix
          for platform_id in $FERRIKI_PLATFORM_IDS; do
            FERRIKI_PLATFORM_ID="$platform_id" pnpm run check:platform-package
          done
          node ./scripts/check-docs-contract.mjs

      # Publish only after the generated main-package tarball installs and loads
      # in a clean consumer. The native-smoke matrix runs this on every target;
      # this repeats the Linux release artifact check immediately before npm.
      - name: Verify packed main-package consumer
        run: node ./scripts/check-packed-consumer.mjs
        env:
          FERRIKI_PLATFORM_ID: linux-x64-gnu

      - name: Verify packed Vite consumer
        run: pnpm run check:packed-vite
        env:
          FERRIKI_PLATFORM_ID: linux-x64-gnu

      - name: Publish platform packages with npm provenance
        working-directory: node
        run: |
          for platform_id in $FERRIKI_PLATFORM_IDS; do
            npm publish "./platforms/$platform_id" --access public --provenance --tag "$NPM_DIST_TAG"
          done

      - name: Publish main package with npm provenance
        working-directory: node/ferriki
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"

      # Pack with pnpm 10 to rewrite catalog: dependencies, then give the
      # explicit tarball to npm 11 for OIDC Trusted Publishing and provenance.
      - name: Pack and publish Vite integration with npm provenance
        working-directory: node
        run: |
          pnpm --dir vite pack --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/vite-pack.json"
          vite_tarball="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).filename)' "$RUNNER_TEMP/vite-pack.json")"
          test -f "$vite_tarball"
          npm publish "$vite_tarball" --access public --provenance --tag "$NPM_DIST_TAG"

  verify-npm-publish:
    needs:
      - release-please
      - publish-npm
    if: ${{ always() && (needs.release-please.outputs.releases_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force-publish)) }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Verify public npm packages, provenance, and install
        run: node ./node/scripts/verify-npm-publish.mjs
        env:
          NPM_PUBLISH_RESULT: ${{ needs.publish-npm.result }}

  release-summary:
    needs:
      - release-please
      - build-native
      - publish-npm
      - verify-npm-publish
    if: ${{ always() }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Summarize release outcome
        env:
          RELEASES_CREATED: ${{ needs.release-please.outputs.releases_created }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force-publish || false }}
          RELEASE_RESULT: ${{ needs.release-please.result }}
          BUILD_RESULT: ${{ needs.build-native.result }}
          PUBLISH_RESULT: ${{ needs.publish-npm.result }}
          VERIFY_RESULT: ${{ needs.verify-npm-publish.result }}
        run: node ./node/scripts/write-release-summary.mjs
