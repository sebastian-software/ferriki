name: Homepage

on:
  pull_request:
    paths:
      - 'homepage/**'
      - 'docs/**'
      - 'node/**'
      - 'crates/**'
      - 'src/**'
      - 'assets/shiki/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/publish-blacksmith-evidence.mjs'
      - '.github/workflows/deploy-homepage.yml'
  push:
    branches: [main]
    paths:
      - 'homepage/**'
      - 'docs/**'
      - 'node/**'
      - 'crates/**'
      - 'src/**'
      - 'assets/shiki/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/publish-blacksmith-evidence.mjs'
      # The site states the measured figures of this report and the version
      # of this manifest (homepage/app/data/benchmarks.ts, app/version.ts), so
      # a new measurement or a release pull request must redeploy it.
      - '.github/workflows/deploy-homepage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homepage
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: homepage/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            node/pnpm-lock.yaml
            homepage/pnpm-lock.yaml

      - name: Set Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Ferriki dependencies
        working-directory: node
        run: pnpm install --frozen-lockfile

      - name: Build native Ferriki package and seed its asset cache
        working-directory: node
        run: pnpm run build:native

      - name: Install homepage dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source samples, the footprint record and packed-package guide examples
        run: |
          pnpm sample:check
          pnpm prism-sample:check
          pnpm class-sample:check
          pnpm macro-sample:check
          pnpm footprint:check
          node scripts/check-guide-examples.mjs

      - name: Check the optional packed Vite adapter
        working-directory: node
        run: pnpm run check:packed-vite

      - name: Lint, typecheck and format
        run: pnpm lint && pnpm typecheck && pnpm format:check

      # Also verifies the prerendered pages against the benchmark report.
      - name: Build
        run: pnpm build

      - name: Install Chromium for browser checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Check responsive layout, accessibility and keyboard navigation
        run: node scripts/check-browser.mjs

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: homepage/build/client

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
