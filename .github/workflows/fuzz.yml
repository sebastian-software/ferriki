name: Rust fuzz smoke

on:
  pull_request:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'schedule' && 50 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - parse_raw_grammar
          - decode_fkgram
          - tokenize_line
          - theme_application
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '600' || '30' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set nightly Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: nightly-2026-07-20
          components: rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            fuzz -> target

      - name: Install cargo-fuzz
        run: cargo +nightly-2026-07-20 install cargo-fuzz --version 0.13.2 --locked

      - name: Check fuzz lockfile and fetch dependencies
        run: cargo +nightly-2026-07-20 fetch --manifest-path fuzz/Cargo.toml --locked

      - name: Check fuzz target formatting
        run: cargo +nightly-2026-07-20 fmt --manifest-path fuzz/Cargo.toml --all -- --check

      - name: Fuzz ${{ matrix.target }}
        run: >-
          cargo +nightly-2026-07-20 fuzz run --fuzz-dir fuzz ${{ matrix.target }} --
          -max_total_time=${{ env.FUZZ_SECONDS }}
          -timeout=10
          -max_len=65536
          -malloc_limit_mb=256
          -rss_limit_mb=1024

      - name: Check lockfiles stayed pinned
        if: always()
        run: git diff --exit-code -- Cargo.lock fuzz/Cargo.lock

      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}-${{ github.run_id }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 14
