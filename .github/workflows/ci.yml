name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: nr lint

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build
        run: nr build

      - name: Typecheck
        run: nr typecheck

  textmate-compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5

      - name: Set Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native
        run: pnpm run build:native

      - name: Prepare compatibility inputs without mutating the mirror
        run: pnpm run prepare:compat

      - name: Verify compatibility mirror is clean
        run: pnpm run check:compat-mirror

      - name: Run native TextMate compatibility gate
        run: pnpm run test:ferriki-compat:textmate

  core-compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5

      - name: Set Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run honest supported core compatibility gate
        run: pnpm run test:ferriki-compat:core

  native-smoke:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: node

    strategy:
      matrix:
        node: [22.x]
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - node: 20.x
            os: ubuntu-latest
      fail-fast: false

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          package_json_file: node/package.json

      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native
        run: pnpm run build:native

      - name: Import ferriki package and load the native binding
        run: node --input-type=module -e "const m = await import('./ferriki/index.mjs'); const v = m.ferrikiVersion(); if (!v) throw new Error('native binding did not load'); console.log('ferriki native core', v)"
