name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: nr lint

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build compatibility packages
        run: pnpm run build:compat

      - name: Build
        run: nr build

      - name: Verify generated API is committed
        run: nr check:api

      - name: Typecheck
        run: nr typecheck

  textmate-compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5

      - name: Set Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native
        run: pnpm run build:native

      - name: Prepare compatibility inputs without mutating the mirror
        run: pnpm run prepare:compat

      - name: Verify compatibility mirror is clean
        run: pnpm run check:compat-mirror

      - name: Run native TextMate compatibility gate
        run: pnpm run test:ferriki-compat:textmate

  core-compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5

      - name: Set Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run honest supported core compatibility gate
        run: pnpm run test:ferriki-compat:core

  native-smoke:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: node

    strategy:
      matrix:
        include:
          - node: 22.x
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            platform-target: linux-x64
            platform-id: linux-x64-gnu
          - node: 22.x
            os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            platform-target: linux-arm64
            platform-id: linux-arm64-gnu
          - node: 22.x
            os: macos-latest
            rust-target: aarch64-apple-darwin
            platform-target: darwin-arm64
            platform-id: darwin-arm64
          - node: 22.x
            os: macos-15-intel
            rust-target: x86_64-apple-darwin
            platform-target: darwin-x64
            platform-id: darwin-x64
          - node: 22.x
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            platform-target: win32-x64
            platform-id: win32-x64-msvc
      fail-fast: false

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Set Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          package_json_file: node/package.json

      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native
        run: pnpm run build:native
        env:
          FERRIKI_RUST_TARGET: ${{ matrix.rust-target }}
          FERRIKI_PLATFORM_TARGET: ${{ matrix.platform-target }}
          FERRIKI_PLATFORM_ID: ${{ matrix.platform-id }}

      - name: Verify native platform package
        run: nr check:platform-package
        env:
          FERRIKI_PLATFORM_ID: ${{ matrix.platform-id }}

      - name: Verify packed consumer on the target platform
        run: node ./scripts/check-packed-consumer.mjs

      - name: Import ferriki package and load the native binding
        run: node --input-type=module -e "const m = await import('./ferriki/index.mjs'); const v = m.ferrikiVersion(); if (!v) throw new Error('native binding did not load'); console.log('ferriki native core', v)"
