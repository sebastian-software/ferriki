name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  pr-title:
    name: Conventional pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify the pin check itself
        run: node scripts/test-check-workflow-pins.mjs

      - name: Verify every workflow action is pinned by commit SHA
        run: node scripts/check-workflow-pins.mjs

  standards:
    name: Standards drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Guard: agent step not yet completed for this PR"
        run: test ! -f .standards/pending.json

      # `.standards/blocked.json` records an agent run that pushed a result it
      # could not validate. `blocking: true` is the CLI/stamp alignment class:
      # every verdict of that run was computed against the wrong manifest, so
      # the pull request must not merge. A non-blocking marker is context for
      # the reviewer - the failures it lists are reported by this workflow's own
      # lanes. The marker is parsed rather than matched line by line: JSON may
      # put `"blocking":` and `true` on separate lines, and a guard whose whole
      # purpose is to fail closed must fail on a marker it cannot read at all.
      # `node` rather than `jq`, which the Forgejo node image may lack; the
      # schema is `BlockedState` in @sebastian-software/standards.
      - name: "Guard: no blocking agent findings for this PR"
        run: |
          node -e "
          const { existsSync, readFileSync } = require('node:fs');
          const file = '.standards/blocked.json';
          if (!existsSync(file)) { process.exit(0); }
          const raw = readFileSync(file, 'utf8');
          console.log(raw);
          const fail = (detail) => { console.error('Refusing to pass ' + file + ': ' + detail); process.exit(1); };
          let state;
          try { state = JSON.parse(raw); } catch (error) { fail('it is not valid JSON - ' + error.message); }
          if (typeof state !== 'object' || state === null || Array.isArray(state)) { fail('it is not a JSON object.'); }
          const orNull = (value, type) => value === null || typeof value === type;
          const broken = [
            ['schemaVersion must be 1', state.schemaVersion !== 1],
            ['blocking must be a boolean', typeof state.blocking !== 'boolean'],
            ['reason must be a string', typeof state.reason !== 'string'],
            ['detectedAt must be a string', typeof state.detectedAt !== 'string'],
            ['expectedStandardsVersion must be a number', typeof state.expectedStandardsVersion !== 'number'],
            ['observedStandardsVersion must be a number or null', !orNull(state.observedStandardsVersion, 'number')],
            ['expectedCliVersion must be a string or null', !orNull(state.expectedCliVersion, 'string')],
            ['observedCliVersion must be a string or null', !orNull(state.observedCliVersion, 'string')],
            ['failedChecks must be an array of strings', !Array.isArray(state.failedChecks) || !state.failedChecks.every((entry) => typeof entry === 'string')],
            ['retry must be a string', typeof state.retry !== 'string'],
          ].filter((entry) => entry[1]).map((entry) => entry[0]);
          if (broken.length > 0) { fail('it does not match the documented schema - ' + broken.join('; ')); }
          if (state.blocking) { fail('the agent could not validate its result.'); }
          console.log('The agent marker is non-blocking; its findings are reviewer context.');
          "

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - run: pnpm -C node install --frozen-lockfile

      # `@sebastian-software/standards` is a pinned devDependency, so this runs
      # the exact version the lockfile records and CI executes nothing that was
      # not reviewed in a pull request. Renovate's `:standards` preset bumps the
      # pin; the drift it then reports is applied in that same pull request.
      #
      # The pinned CLI has to ship the manifest version this repository is
      # stamped at. Below the stamp, every `standards check` verdict is computed
      # against an outdated manifest, and `check` reports that as a blocking
      # finding rather than as drift. `require.resolve` also searches the
      # directories declared in `.repometa.json#workspaces`, so a devDependency
      # installed in a nested workspace is found too. `node -p` rather than
      # `jq`, which the Forgejo node image may lack.
      - name: "Guard: the pinned standards CLI matches the repository stamp"
        run: |
          node -p "
          const meta = require('./.repometa.json');
          const paths = [process.cwd(), ...(meta.workspaces ?? [])];
          const manifest = require(require.resolve('@sebastian-software/standards/manifest.json', { paths }));
          if (manifest.currentVersion !== meta.standards) {
            throw new Error('The installed @sebastian-software/standards ships manifest version ' + manifest.currentVersion + ', but .repometa.json is stamped ' + meta.standards + '. Raise the pin to the release whose manifest is version ' + meta.standards + ' and refresh the lockfile.');
          }
          const { readFileSync } = require('node:fs');
          const { join, relative } = require('node:path');
          const cli = '@sebastian-software/standards';
          const isRecord = (value) => typeof value === 'object' && value !== null && !Array.isArray(value);
          const units = paths.flatMap((dir) => {
            const file = join(dir, 'package.json');
            try { const pkg = JSON.parse(readFileSync(file, 'utf8')); return isRecord(pkg) ? [{ file: relative(process.cwd(), file), pkg }] : []; } catch { return []; }
          });
          const exact = (spec) => typeof spec === 'string' && /^(?:0|[1-9][0-9]*)[.](?:0|[1-9][0-9]*)[.](?:0|[1-9][0-9]*)(?:-(?:[0-9]*[A-Za-z-][0-9A-Za-z-]*|0|[1-9][0-9]*)(?:[.](?:[0-9]*[A-Za-z-][0-9A-Za-z-]*|0|[1-9][0-9]*))*)?(?:[+][0-9A-Za-z-]+(?:[.][0-9A-Za-z-]+)*)?/.exec(spec)?.[0] === spec && spec.length <= 256 && spec.split(/[+-]/, 1)[0].split('.').every((part) => Number(part) <= Number.MAX_SAFE_INTEGER);
          const shown = (spec) => {
            const text = typeof spec === 'string' ? spec : JSON.stringify(spec);
            const reduced = text.includes('://') ? text.slice(0, text.indexOf('://') + 1) : text;
            return [...reduced].map((char) => { const code = char.charCodeAt(0); return code < 32 || (code >= 127 && code < 160) ? '?' : char; }).join('');
          };
          const declared = units.flatMap((unit) => [unit.pkg.devDependencies, unit.pkg.dependencies].filter((deps) => isRecord(deps) && Object.hasOwn(deps, cli)).map((deps) => ({ file: unit.file, spec: deps[cli] })));
          const exempt = units.some((unit) => unit.pkg.name === cli);
          const loose = exempt ? [] : declared.filter((entry) => !exact(entry.spec));
          if (loose.length > 0) {
            throw new Error(loose.map((entry) => entry.file + ' declares ' + cli + ' as ' + shown(entry.spec)).join('; ') + ' — the pin must be a bare exact version literal such as 0.11.1. Set its value to an exact version in that package.json and dependency field (install with pnpm add --save-exact @sebastian-software/standards@<version>, adding --save-dev for a devDependency), and refresh the lockfile.');
          }
          if (!exempt && units.length > 0 && declared.length === 0) {
            throw new Error('No package.json declares ' + cli + ', but this workflow runs it. Add @sebastian-software/standards@<version> as a devDependency pinned to a bare exact version literal in the package.json this job installs from, and refresh the lockfile.');
          }
          'standards CLI and repository stamp are aligned at version ' + meta.standards + ', and the pin is an exact version literal'
          "

      - name: Check for standards drift
        run: ./node/node_modules/.bin/standards check

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

  rust-platforms:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --workspace --all-features --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `rust-version` in the root Cargo.toml is the single source of truth for
      # the MSRV; nothing here restates the number.
      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV is $version"

      - name: Set Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `cargo +<toolchain>` beats rust-toolchain.toml, which would otherwise
      # pull this job back to stable and make it prove nothing.
      - name: Check against the MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --all-features --locked

  rust-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Rustdoc
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov

      # `coverage-threshold` is the single source of truth for the gate; the
      # README badge and CONTRIBUTING point at that file, and nothing here
      # restates the number.
      - name: Read the coverage threshold
        id: threshold
        run: |
          threshold=$(tr -d '[:space:]' < coverage-threshold)
          # A percent, and only a percent: 0 to 100, no leading zeros.
          if ! echo "$threshold" | grep -Eq '^(100|[1-9]?[0-9])$'; then
            echo "coverage-threshold must hold a whole percent between 0 and 100, found '$threshold'" >&2
            exit 1
          fi
          echo "value=$threshold" >> "$GITHUB_OUTPUT"
          echo "Line coverage gate is >= $threshold%"

      - name: Collect coverage and enforce the gate
        run: |
          cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info \
            --fail-under-lines "${{ steps.threshold.outputs.value }}"

      # cargo-llvm-cov fails the gate through its exit code alone, so the
      # measured number is reported here in every outcome. It writes the report
      # before checking the threshold, so `lcov.info` exists on failure too.
      - name: Report line coverage
        if: always()
        run: |
          threshold="${{ steps.threshold.outputs.value }}"
          if [ -f lcov.info ]; then
            summary=$(awk -F: -v threshold="$threshold" '
              /^LF:/ { total += $2 }
              /^LH:/ { covered += $2 }
              END {
                if (total > 0)
                  printf "Line coverage: %.2f%% (gate: ≥ %s%%)", covered * 100 / total, threshold
                else
                  printf "Line coverage: no instrumented lines (gate: ≥ %s%%)", threshold
              }' lcov.info)
          else
            summary="Line coverage: not collected (gate: ≥ ${threshold}%)"
          fi
          echo "$summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: nr lint

      - name: Verify the release workflow and checklist contract
        run: pnpm run check:release

      # The family block in both READMEs is generated from the registry in
      # sebastian-software/ferramenta; this fails when either has drifted.
      - name: Verify the generated Ferramenta family block
        working-directory: ${{ github.workspace }}
        run: node scripts/sync-readme-family.mjs --check

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build compatibility packages
        run: pnpm run build:compat

      - name: Build
        run: nr build

      - name: Verify generated API is committed
        run: nr check:api

      - name: Typecheck
        run: nr typecheck

  textmate-compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native
        run: pnpm run build:native

      - name: Prepare compatibility inputs without mutating the mirror
        run: pnpm run prepare:compat

      - name: Verify compatibility mirror is clean
        run: pnpm run check:compat-mirror

      - name: Run native TextMate compatibility gate
        run: pnpm run test:ferriki-compat:textmate

  core-compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run honest supported core compatibility gate
        run: pnpm run test:ferriki-compat:core

  native-smoke:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: node

    strategy:
      matrix:
        include:
          - node: 22.x
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            platform-target: linux-x64
            platform-id: linux-x64-gnu
          - node: 22.x
            os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            platform-target: linux-arm64
            platform-id: linux-arm64-gnu
          - node: 22.x
            os: macos-latest
            rust-target: aarch64-apple-darwin
            platform-target: darwin-arm64
            platform-id: darwin-arm64
          - node: 22.x
            os: macos-15-intel
            rust-target: x86_64-apple-darwin
            platform-target: darwin-x64
            platform-id: darwin-x64
          - node: 22.x
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            platform-target: win32-x64
            platform-id: win32-x64-msvc
      fail-fast: false

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json

      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native
        run: pnpm run build:native
        env:
          FERRIKI_RUST_TARGET: ${{ matrix.rust-target }}
          FERRIKI_PLATFORM_TARGET: ${{ matrix.platform-target }}
          FERRIKI_PLATFORM_ID: ${{ matrix.platform-id }}

      - name: Verify native platform package
        run: nr check:platform-package
        env:
          FERRIKI_PLATFORM_ID: ${{ matrix.platform-id }}

      - name: Verify packed consumer on the target platform
        run: node ./scripts/check-packed-consumer.mjs

      - name: Verify the installed sidecar is what the loader resolves
        run: nr check:packed-sidecar
        env:
          FERRIKI_PLATFORM_ID: ${{ matrix.platform-id }}

      - name: Import ferriki package and load the native binding
        run: node --input-type=module -e "const m = await import('./ferriki/index.mjs'); const v = m.ferrikiVersion(); if (!v) throw new Error('native binding did not load'); console.log('ferriki native core', v)"
