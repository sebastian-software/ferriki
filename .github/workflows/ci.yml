name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  pr-title:
    name: Conventional pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  workflow-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify the pin check itself
        run: node scripts/test-check-workflow-pins.mjs

      - name: Verify every workflow action is pinned by commit SHA
        run: node scripts/check-workflow-pins.mjs

  adrs:
    name: Decision records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify the decision record check itself
        run: node scripts/test-check-adrs.mjs

      # Records are living documents (adr/README.md); this keeps their status,
      # dates and the index in sync. Whether the content is current is part of
      # every review.
      - name: Verify the decision records and their index
        run: node scripts/check-adrs.mjs

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

  rust-platforms:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --workspace --all-features --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # `rust-version` in the root Cargo.toml is the single source of truth for
      # the MSRV; nothing here restates the number.
      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Declared MSRV is $version"

      - name: Set Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # `cargo +<toolchain>` beats rust-toolchain.toml, which would otherwise
      # pull this job back to stable and make it prove nothing.
      - name: Check against the MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --all-features --locked

  rust-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Rustdoc
        run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov

      # `coverage-threshold` is the single source of truth for the gate; the
      # README badge and CONTRIBUTING point at that file, and nothing here
      # restates the number.
      - name: Read the coverage threshold
        id: threshold
        run: |
          threshold=$(tr -d '[:space:]' < coverage-threshold)
          # A percent, and only a percent: 0 to 100, no leading zeros.
          if ! echo "$threshold" | grep -Eq '^(100|[1-9]?[0-9])$'; then
            echo "coverage-threshold must hold a whole percent between 0 and 100, found '$threshold'" >&2
            exit 1
          fi
          echo "value=$threshold" >> "$GITHUB_OUTPUT"
          echo "Line coverage gate is >= $threshold%"

      - name: Collect coverage and enforce the gate
        run: |
          cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info \
            --fail-under-lines "${{ steps.threshold.outputs.value }}"

      # cargo-llvm-cov fails the gate through its exit code alone, so the
      # measured number is reported here in every outcome. It writes the report
      # before checking the threshold, so `lcov.info` exists on failure too.
      - name: Report line coverage
        if: always()
        run: |
          threshold="${{ steps.threshold.outputs.value }}"
          if [ -f lcov.info ]; then
            summary=$(awk -F: -v threshold="$threshold" '
              /^LF:/ { total += $2 }
              /^LH:/ { covered += $2 }
              END {
                if (total > 0)
                  printf "Line coverage: %.2f%% (gate: ≥ %s%%)", covered * 100 / total, threshold
                else
                  printf "Line coverage: no instrumented lines (gate: ≥ %s%%)", threshold
              }' lcov.info)
          else
            summary="Line coverage: not collected (gate: ≥ ${threshold}%)"
          fi
          echo "$summary"
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: nr lint

      - name: Verify the release workflow and checklist contract
        run: pnpm run check:release

      # The family block in both READMEs is generated from the registry in
      # sebastian-software/ferramenta; this fails when either has drifted.
      - name: Verify the generated Ferramenta family block
        working-directory: ${{ github.workspace }}
        run: node scripts/sync-readme-family.mjs --check

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build compatibility packages
        run: pnpm run build:compat

      - name: Build
        run: nr build

      - name: Verify generated API is committed
        run: nr check:api

      - name: Typecheck
        run: nr typecheck

  textmate-compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native
        run: pnpm run build:native

      - name: Prepare compatibility inputs without mutating the mirror
        run: pnpm run prepare:compat

      - name: Verify compatibility mirror is clean
        run: pnpm run check:compat-mirror

      - name: Run native TextMate compatibility gate
        run: pnpm run test:ferriki-compat:textmate

  core-compat:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json

      - name: Set node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run honest supported core compatibility gate
        run: pnpm run test:ferriki-compat:core

      - name: Verify TIOBE benchmark outputs and comparison contracts
        run: pnpm run check:bench-tiobe

  native-smoke:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: node

    strategy:
      matrix:
        include:
          - node: 22.x
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            platform-target: linux-x64
            platform-id: linux-x64-gnu
          - node: 22.x
            os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-gnu
            platform-target: linux-arm64
            platform-id: linux-arm64-gnu
          # musl targets cross-compile with cargo-zigbuild on a glibc runner of
          # the same architecture and run their runtime checks in Alpine.
          - node: 22.x
            os: ubuntu-latest
            rust-target: x86_64-unknown-linux-musl
            platform-target: linux-x64-musl
            platform-id: linux-x64-musl
            musl: true
          - node: 22.x
            os: ubuntu-24.04-arm
            rust-target: aarch64-unknown-linux-musl
            platform-target: linux-arm64-musl
            platform-id: linux-arm64-musl
            musl: true
          - node: 22.x
            os: macos-latest
            rust-target: aarch64-apple-darwin
            platform-target: darwin-arm64
            platform-id: darwin-arm64
          - node: 22.x
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            platform-target: win32-x64
            platform-id: win32-x64-msvc
          - node: 22.x
            os: windows-11-arm
            rust-target: aarch64-pc-windows-msvc
            platform-target: win32-arm64
            platform-id: win32-arm64-msvc
      fail-fast: false

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set Rust target
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Set up Zig for the musl cross-build
        if: ${{ matrix.musl }}
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Install cargo-zigbuild
        if: ${{ matrix.musl }}
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: node/package.json

      - name: Set node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Setup
        run: npm i -g @antfu/ni

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build native
        run: pnpm run build:native
        env:
          FERRIKI_RUST_TARGET: ${{ matrix.rust-target }}
          FERRIKI_PLATFORM_TARGET: ${{ matrix.platform-target }}
          FERRIKI_PLATFORM_ID: ${{ matrix.platform-id }}

      - name: Verify native platform package
        run: nr check:platform-package
        env:
          FERRIKI_PLATFORM_ID: ${{ matrix.platform-id }}

      - name: Verify packed consumer on the target platform
        if: ${{ !matrix.musl }}
        run: node ./scripts/check-packed-consumer.mjs

      - name: Verify the installed sidecar is what the loader resolves
        if: ${{ !matrix.musl }}
        run: nr check:packed-sidecar
        env:
          FERRIKI_PLATFORM_ID: ${{ matrix.platform-id }}

      - name: Import ferriki package and load the native binding
        if: ${{ !matrix.musl }}
        run: node --input-type=module -e "const m = await import('./ferriki/index.mjs'); const v = m.ferrikiVersion(); if (!v) throw new Error('native binding did not load'); console.log('ferriki native core', v)"

      # The glibc runner cannot load a musl addon, so the same three runtime
      # checks run in an Alpine container on the runner's architecture.
      - name: Verify packed consumer, sidecar and import on Alpine musl
        if: ${{ matrix.musl }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/w" -w /w/node \
            -e FERRIKI_PLATFORM_ID="$FERRIKI_PLATFORM_ID" node:22-alpine sh -euc '
              node -e "if (process.report.getReport().header.glibcVersionRuntime) throw new Error(\"not a musl host\")"
              node ./scripts/check-packed-consumer.mjs
              node ./scripts/check-packed-sidecar.mjs
              node --input-type=module -e "const m = await import(\"./ferriki/index.mjs\"); const v = m.ferrikiVersion(); if (!v) throw new Error(\"native binding did not load\"); console.log(\"ferriki native core\", v)"
            '
        env:
          FERRIKI_PLATFORM_ID: ${{ matrix.platform-id }}
