[package]
name = "ferriki-syntect-comparison"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = []
syntect-onig = ["dep:syntect", "syntect/regex-onig"]
syntect-fancy = ["dep:syntect", "syntect/regex-fancy"]
ferriki-only = []

[dependencies]
ferriki = { path = "../..", version = "0.13.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syntect = { version = "=5.3.0", optional = true, default-features = false, features = ["default-syntaxes", "default-themes", "html"] }

# Keep the release profile aligned with the repository root package.
[profile.release]
debug = false
strip = "symbols"
lto = "fat"
codegen-units = 1
