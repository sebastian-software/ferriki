[workspace]
members = [
  "crates/ferriki-asset-gen",
  "crates/ferriki-core",
  "crates/ferriki-textmate",
]
resolver = "2"

[workspace.package]
edition = "2024"
# Ferramenta family policy D4: stay within four stable releases of current stable.
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = [ "Sebastian Software GmbH" ]
repository = "https://github.com/sebastian-software/ferriki"
homepage = "https://ferramenta.dev"
# crates.io allows at most five keywords; "ferramenta" marks the tool family.
keywords = [ "syntax-highlighting", "textmate", "shiki", "tokenizer", "ferramenta" ]
categories = [ "text-processing", "parser-implementations", "development-tools" ]

[workspace.dependencies]
bincode = "1.3"
ferroni = "1.3.3"
napi = { version = "2", default-features = false, features = [ "napi8" ] }
napi-build = "2"
napi-derive = "2"
serde = { version = "1", features = [ "derive", "rc" ] }
serde_json = "1"

[workspace.lints.rust]
# The N-API cdylib in ferriki-core is built from napi-derive expansions that
# generate `unsafe` extern bindings, so this stays a warning instead of a deny.
unsafe_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = false
strip = "symbols"
