# `ferriki` is the repository's root package, which is what Release Please's
# native `rust` strategy requires: it updates the root `[package]` version, the
# members listed below, their explicit path dependency requirements and
# `Cargo.lock`. npm and crates.io share one version and one release signal.
# See ADR 0012 and docs/release-checklist.md.
[package]
name = "ferriki"
version = "0.13.0"
description = "Reusable native Rust syntax highlighter with TextMate grammars"
readme = "README.md"
documentation = "https://docs.rs/ferriki"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = ["crates-io"]
# The package sits at the repository root, so the published archive is an
# explicit allow-list rather than everything Cargo finds. Node sources, the
# upstream mirrors, the other crates and the grammar and theme payloads stay
# out; only the two catalog manifests and the release manifest ship, so the
# `remote` feature can resolve and verify payloads from the CDN (ADR 0013).
include = [
  "/build.rs",
  "/src",
  "/tests",
  "/examples",
  "/assets/shiki/languages/manifest.fkindex",
  "/assets/shiki/themes/manifest.fkindex",
  "/assets/shiki/release-manifest.json",
  "/README.md",
  "/LICENSE-MIT",
  "/LICENSE-APACHE",
]

[features]
# Loads standard payloads on demand from the release-pinned CDN mirror,
# verified and cached by digest (ADR 0013). Off by default, so the library
# stays free of network code unless a consumer opts in.
remote = ["dep:ureq", "dep:rustls"]

[dependencies]
ferriki-asset-gen = { version = "0.13.0", path = "crates/ferriki-asset-gen" }
ferriki-textmate = { version = "0.13.0", path = "crates/ferriki-textmate" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

# The HTTP client exists only outside wasm32, where it cannot run; a wasm build
# gets its own fetch path (ADR 0009). TLS uses rustls with ring and the
# operating system's trust store, so corporate CAs and TLS inspection work.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rustls = { version = "0.23", default-features = false, features = [ "ring", "std", "tls12" ], optional = true }
ureq = { version = "3", default-features = false, features = [ "rustls-no-provider", "platform-verifier", "gzip" ], optional = true }

[[example]]
name = "remote_assets"
required-features = ["remote"]

[lints]
workspace = true

# Package versions are deliberately concrete in every member: Release Please
# cannot replace an inherited `version.workspace = true`, and it skips a path
# dependency that does not spell out a `version`.
[workspace]
members = [
  ".",
  "crates/ferriki-asset-gen",
  "crates/ferriki-core",
  "crates/ferriki-textmate",
]
resolver = "2"

[workspace.package]
edition = "2024"
# Ferramenta family policy D4: stay within four stable releases of current stable.
rust-version = "1.94"
license = "MIT OR Apache-2.0"
authors = [ "Sebastian Software GmbH" ]
repository = "https://github.com/sebastian-software/ferriki"
homepage = "https://ferriki.dev"
# crates.io allows at most five keywords; "ferramenta" marks the tool family.
keywords = [ "syntax-highlighting", "textmate", "shiki", "tokenizer", "ferramenta" ]
categories = [ "text-processing", "parser-implementations", "development-tools" ]

[workspace.dependencies]
ferroni = "2.1.0"
napi = { version = "3", default-features = false, features = [ "napi8" ] }
napi-build = "2.6"
napi-derive = "3"
postcard = { version = "1.1", default-features = false, features = [ "use-std" ] }
serde = { version = "1", features = [ "derive", "rc" ] }
serde_json = "1"
sha2 = "0.10"

[workspace.lints.rust]
# The N-API cdylib in ferriki-core is built from napi-derive expansions that
# generate `unsafe` extern bindings, so this stays a warning instead of a deny.
unsafe_code = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
debug = false
strip = "symbols"
# Measured on linux-x64: the addon shrinks from 2.60 MB to 2.40 MB with cold
# start and throughput unchanged or slightly faster (within run-to-run noise).
lto = "fat"
codegen-units = 1
