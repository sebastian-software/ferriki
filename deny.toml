[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # RUSTSEC-2025-0141: bincode 1.3.3 is complete but no longer maintained. It
  # encodes the `.fkindex` / `.fkgram` asset format, so replacing it is an
  # asset-format change tracked separately, not a dependency bump.
  "RUSTSEC-2025-0141",
]

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# The workspace crates are `publish = false` and depend on each other by path,
# which cargo-deny reports as a wildcard requirement.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [ "https://github.com/rust-lang/crates.io-index" ]
