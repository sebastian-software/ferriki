[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

# webpki-root-certs (Mozilla's root store as data, CDLA-Permissive-2.0) is a
# wasm32-only dependency of rustls-platform-verifier. Ferriki's `remote`
# feature enables ureq only outside wasm32 and verifies TLS against the
# operating system's trust store, so no shipped build contains it; cargo-deny
# still sees it because it checks the union of all targets.
[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[bans]
multiple-versions = "warn"
# The workspace crates depend on each other by path and version. Path-only
# requirements stay allowed for unpublished members such as `ferriki-core`.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [ "https://github.com/rust-lang/crates.io-index" ]
