[package]
name = "ferriki-core"
version = "0.14.0"
description = "Native N-API core of the Ferriki Shiki-compatible highlighter"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
build = "build.rs"

[lib]
name = "ferriki_core"
crate-type = [ "cdylib", "rlib" ]
path = "src/lib.rs"

[features]
# Adds `profileTokenBoundary` and a counting allocator for
# node/scripts/profile-native-boundary.mjs. Release addons never enable it.
profiling = []

[dependencies]
# Rust plans and verifies assets; the Node facade owns network transport (ADR 0013).
ferriki = { version = "0.14.0", path = "../..", default-features = false }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Resolve Node symbols dynamically only when linking the standalone Rust tests.
napi = { workspace = true, features = ["dyn-symbols"] }

[build-dependencies]
napi-build = { workspace = true }

[lints]
workspace = true
