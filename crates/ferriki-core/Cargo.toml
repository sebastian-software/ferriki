[package]
name = "ferriki-core"
version = "0.8.2"
description = "Native N-API core of the Ferriki Shiki-compatible highlighter"
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
build = "build.rs"

[lib]
name = "ferriki_core"
crate-type = [ "cdylib", "rlib" ]
path = "src/lib.rs"

[dependencies]
# The N-API host loads standard payloads from the release-pinned CDN (ADR 0013).
ferriki = { version = "0.8.2", path = "../..", features = [ "remote" ] }
napi = { workspace = true }
napi-derive = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

[lints]
workspace = true
