[package]
name = "ferriki-core"
version = "0.1.0"
description = "Native N-API core of the Ferriki Shiki-compatible highlighter"
readme = "../../README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false
build = "build.rs"

[lib]
name = "ferriki_core"
crate-type = [ "cdylib", "rlib" ]
path = "src/lib.rs"

[dependencies]
ferriki-asset-gen = { path = "../ferriki-asset-gen" }
ferriki-textmate = { path = "../ferriki-textmate" }
napi = { workspace = true }
napi-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

[lints]
workspace = true
